<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in | Paper Matcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --paper: #f7f3e8;
      --ink: #201e1d;
      --red: #ec3013;
      --line: rgba(32, 30, 29, 0.38);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 48px,
        var(--paper);
      font-family: "Archivo", sans-serif;
    }
    main {
      width: min(100%, 520px);
      border: 2px solid var(--ink);
      background: var(--paper);
      box-shadow: 12px 12px 0 var(--red);
    }
    header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--ink);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .mark { width: 12px; height: 12px; background: var(--red); }
    section { padding: 44px 40px 40px; }
    .kicker { margin: 0 0 12px; color: var(--red); font-size: 12px; font-weight: 800; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(34px, 8vw, 58px); line-height: 0.95; }
    .intro { margin: 20px 0 30px; max-width: 38ch; line-height: 1.6; font-size: 14px; }
    .signin { min-height: 44px; display: flex; align-items: center; }
    .error { margin: 0 0 20px; padding: 12px; border-left: 4px solid var(--red); background: #fff; font-size: 13px; }
    .hidden { display: none; }
    footer { padding: 14px 20px; border-top: 1px solid var(--line); font-size: 11px; opacity: 0.65; }
    @media (max-width: 560px) {
      main { box-shadow: 7px 7px 0 var(--red); }
      section { padding: 34px 24px; }
    }
  </style>
</head>
<body>
  <main>
    <header><span>Private research workspace</span><span class="mark" aria-hidden="true"></span></header>
    <section>
      <p class="kicker">arXiv + ACL Anthology</p>
      <h1>Paper<br />Matcher</h1>
      <p class="intro">Sign in with an approved Google account to evaluate, rank, and track computational-linguistics research.</p>
      <p class="error __ERROR_CLASS__" role="alert">__AUTH_ERROR__</p>
      <div class="__SIGNIN_CLASS__">
        <div id="g_id_onload"
             data-client_id="__GOOGLE_CLIENT_ID__"
             data-ux_mode="redirect"
             data-login_uri="/login"
             data-auto_prompt="false"></div>
        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="sign_in_with"
             data-shape="rectangular"
             data-logo_alignment="left"></div>
      </div>
    </section>
    <footer>Access limited to two approved accounts.</footer>
  </main>
</body>
</html>
